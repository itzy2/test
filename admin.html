<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBIS TEST 管理者ページ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f1f5f9;
  color: #172033;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

header {
  background: #172554;
  color: white;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

main {
  max-width: 1250px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px #00000010;
}

h2 {
  font-size: 19px;
  margin-top: 0;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  margin: 7px 0 14px;
  font-size: 16px;
}

button {
  background: #1d4ed8;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 11px 16px;
  font-size: 14px;
  cursor: pointer;
  margin: 3px;
}

button.secondary {
  background: #475569;
}

button.green {
  background: #0f766e;
}

button:disabled {
  opacity: .5;
}

.hidden {
  display: none !important;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}

.stat {
  background: #eff6ff;
  border-radius: 10px;
  padding: 16px;
}

.stat strong {
  display: block;
  font-size: 25px;
  margin-top: 8px;
}

.table-wrap {
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
  background: white;
}

th, td {
  padding: 11px;
  border-bottom: 1px solid #e2e8f0;
  text-align: left;
  font-size: 14px;
  vertical-align: top;
}

th {
  background: #f8fafc;
  white-space: nowrap;
}

.answer {
  padding: 12px;
  border-bottom: 1px solid #e2e8f0;
  line-height: 1.7;
}

.good {
  color: #15803d;
  font-weight: bold;
}

.bad {
  color: #dc2626;
  font-weight: bold;
}

.small {
  font-size: 13px;
  color: #64748b;
}

.toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.comment {
  line-height: 1.9;
  background: #f8fafc;
  padding: 14px;
  border-radius: 8px;
  margin-top: 12px;
}

.stats-note {
  font-size: 12px;
  color: #64748b;
  margin-top: 8px;
}

.error {
  white-space: pre-wrap;
  color: #b91c1c;
}

@media print {
  header,
  #loginCard,
  .no-print {
    display: none !important;
  }

  body {
    background: white;
  }

  main {
    max-width: none;
    margin: 0;
    padding: 0;
  }

  .card {
    box-shadow: none;
    border: 0;
    padding: 0;
  }
}
</style>
</head>

<body>

<header>
  <h1>ORBIS TEST 管理者ページ</h1>
  <div class="small" style="color:#dbeafe">
    受験結果・成績・回答管理
  </div>
</header>

<main>

<!-- 管理者ログイン -->
<section id="loginCard" class="card">
  <h2>管理者ログイン</h2>

  <label>メールアドレス</label>
  <input
    id="email"
    type="email"
    autocomplete="username"
    placeholder="登録済みメールアドレス"
  >

  <label>パスワード</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="パスワード"
  >

  <button id="loginBtn" onclick="login()">
    ログイン
  </button>

  <div id="message" class="error"></div>
</section>


<!-- 管理画面 -->
<section id="dashboard" class="hidden">

  <div class="card no-print">
    <div class="toolbar" style="justify-content:space-between">
      <h2>受験結果一覧</h2>

      <div>
        <button class="secondary" onclick="loadResults()">
          最新情報に更新
        </button>

        <button class="secondary" onclick="logout()">
          ログアウト
        </button>
      </div>
    </div>

    <button class="green" onclick="printList()">
      成績一覧を印刷
    </button>
  </div>


  <!-- 統計 -->
  <div class="card stats">

    <div class="stat">
      受験記録
      <strong id="totalCount">0</strong>
    </div>

    <div class="stat">
      提出済み
      <strong id="submittedCount">0</strong>
    </div>

    <div class="stat">
      受験中
      <strong id="ongoingCount">0</strong>
    </div>

  </div>


  <!-- 検索 -->
  <div class="card no-print">
    <h2>絞り込み</h2>

    <label>試験</label>
    <select id="examFilter" onchange="renderResults()">
      <option value="">すべての試験</option>
    </select>

    <label>受験者検索（受験番号・氏名）</label>
    <input
      id="memberFilter"
      placeholder="検索する文字を入力"
      oninput="renderResults()"
    >
  </div>


  <!-- 成績一覧 -->
  <div class="card">
    <h2>受験者の成績</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>受験番号</th>
            <th>氏名</th>
            <th>試験</th>
            <th>正答数</th>
            <th>得点（100点満点）</th>
            <th>参考平均点</th>
            <th>平均差</th>
            <th>状態</th>
            <th class="no-print">操作</th>
          </tr>
        </thead>

        <tbody id="resultsBody"></tbody>
      </table>
    </div>

    <div id="emptyMessage" class="small"></div>

    <p class="stats-note">
      ※参考平均点は、試験ごとに生成した固定の参考値です。
      実際の受験者全員の集計値ではありません。
    </p>
  </div>

</section>

</main>


<script>
"use strict";


/* =====================================
   1. Supabase接続
===================================== */

const SUPABASE_URL =
  "https://hxrtpftlklgwesvanlpk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_b1tG9o1bXMzZBXGHBJZhZA_Ak-KYmnZ";

const ADMIN_ID =
  "4f0efa53-d67b-4d73-9b28-908eadc20525";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   2. データ
===================================== */

let attempts = [];
let questions = [];
let filteredAttempts = [];


/* =====================================
   3. HTML安全処理
===================================== */

function escapeHTML(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c])
  );
}


function showMessage(message) {
  document.getElementById("message").textContent = message;
}


/* =====================================
   4. 参考平均点
===================================== */

function seededNumber(seed, min, max, salt) {
  let h = 2166136261;

  const value = String(seed) + "|" + salt;

  for (let i = 0; i < value.length; i++) {
    h ^= value.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }

  return Math.floor(
    min + (h >>> 0) / 4294967295 * (max - min + 1)
  );
}


function referenceStats(examId) {
  const average = seededNumber(
    examId,
    60,
    80,
    "average"
  );

  return {
    average: average
  };
}


/* =====================================
   5. 試験の問題数を取得
===================================== */

function questionsForAttempt(a) {
  const examId = String(a.exam_id || "");

  if (!examId) {
    return [];
  }

  return questions.filter(q =>
    String(q.exam_id || "") === examId
  );
}


function questionCountFor(a) {
  const matchingQuestions = questionsForAttempt(a);

  if (matchingQuestions.length > 0) {
    return matchingQuestions.length;
  }

  return (
    Number(a.total_questions) ||
    Number(a.question_count) ||
    0
  );
}


/* =====================================
   6. 得点計算
===================================== */

function scoreFor(a) {
  if (
    a.correct_count === null ||
    a.correct_count === undefined
  ) {
    return null;
  }

  const total = questionCountFor(a);
  const correct = Number(a.correct_count);

  if (
    !total ||
    !Number.isFinite(correct) ||
    correct < 0
  ) {
    return null;
  }

  return Math.round(correct / total * 100);
}


/* =====================================
   7. 講評
===================================== */

function commentFor(score) {

  if (score >= 90) {
    return "非常に素晴らしい結果です。これまで積み重ねてきた努力が、今回の得点にしっかり表れています。間違えた問題や迷った問題も確認し、さらに高い目標に挑戦していきましょう。今後のさらなる成長を期待しています。";
  }

  if (score >= 80) {
    return "よく頑張りました。基礎から応用まで、学習の成果が表れています。正解できた問題は自信につなげ、惜しくも間違えた問題は解き方を振り返りましょう。あと一歩の確認を積み重ね、次回はさらに安定した結果を目指してください。";
  }

  if (score >= 60) {
    return "今回の試験、お疲れさまでした。理解できている内容がある一方で、もう少し練習を重ねたい分野も見つかったと思います。結果だけで判断せず、間違えた問題を見直し、なぜその答えになるのかを説明できるようにしていきましょう。毎日の小さな積み重ねが大切です。次回の成長を期待しています。";
  }

  if (score >= 40) {
    return "最後まで試験に取り組んだことを、次につながる経験として受け止めましょう。今回の結果から復習すべき内容が見えてきます。基本事項から一つずつ確認し、短い時間でも繰り返し練習してください。焦らず着実に取り組めば必ず前進できます。次回も諦めずに挑戦しましょう。";
  }

  return "今回の試験は、これからの学習方法を見直す良い機会です。思うような結果でなくても諦める必要はありません。基本事項を確認し、解けなかった問題を一問ずつ整理しましょう。分からないところをそのままにせず、少しずつ理解を積み重ねることが大切です。次回の挑戦を応援しています。";
}


/* =====================================
   8. ログイン
===================================== */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const button =
    document.getElementById("loginBtn");

  if (!email || !password) {
    showMessage(
      "メールアドレスとパスワードを入力してください。"
    );
    return;
  }

  button.disabled = true;
  showMessage("ログインしています...");

  try {

    const { error } = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      throw error;
    }

    await checkAdmin();

  } catch (error) {

    showMessage(
      "ログインできませんでした。\n" + error.message
    );

  } finally {

    button.disabled = false;

  }
}


/* =====================================
   9. 管理者確認
===================================== */

async function checkAdmin() {

  const {
    data: { user },
    error
  } = await db.auth.getUser();

  if (error || !user) {
    showMessage("ログイン情報を確認できません。");
    return;
  }

  if (user.id !== ADMIN_ID) {

    await db.auth.signOut();

    showMessage(
      "このアカウントには管理者権限がありません。"
    );

    return;
  }

  document.getElementById("loginCard")
    .classList.add("hidden");

  document.getElementById("dashboard")
    .classList.remove("hidden");

  await loadResults();
}


/* =====================================
   10. 結果取得
===================================== */

async function loadResults() {

  const {
    data,
    error
  } = await db.rpc("admin_get_results");

  if (error) {

    alert(
      "結果を取得できませんでした。\n" +
      error.message
    );

    return;
  }

  attempts = data?.attempts || [];
  questions = data?.questions || [];

  document.getElementById("totalCount").textContent =
    attempts.length;

  document.getElementById("submittedCount").textContent =
    attempts.filter(a =>
      a.submitted_at || a.status === "submitted"
    ).length;

  document.getElementById("ongoingCount").textContent =
    attempts.filter(a =>
      !a.submitted_at && a.status !== "submitted"
    ).length;


  const filter =
    document.getElementById("examFilter");

  const oldValue = filter.value;

  const examMap = new Map();

  attempts.forEach(a => {
    examMap.set(
      a.exam_code || a.exam_id || a.exam_title,
      a.exam_title || a.exam_code || "試験名不明"
    );
  });

  filter.innerHTML =
    '<option value="">すべての試験</option>';

  examMap.forEach((title, code) => {

    const option = document.createElement("option");

    option.value = code || "";
    option.textContent = title;

    filter.appendChild(option);

  });

  filter.value = oldValue;

  renderResults();
}


/* =====================================
   11. 成績一覧表示
===================================== */

function renderResults() {

  const exam =
    document.getElementById("examFilter").value;

  const keyword =
    document.getElementById("memberFilter")
      .value.trim().toLowerCase();

  filteredAttempts = attempts.filter(a => {

    const examValue =
      a.exam_code || a.exam_id || a.exam_title || "";

    const examMatch =
      !exam || String(examValue) === String(exam);

    const searchText =
      `${a.member_number || ""} ${a.full_name || ""}`
        .toLowerCase();

    return examMatch && searchText.includes(keyword);

  });


  const body =
    document.getElementById("resultsBody");

  body.replaceChildren();

  document.getElementById("emptyMessage").textContent =
    filteredAttempts.length
      ? ""
      : "該当する受験記録はありません。";


  filteredAttempts.forEach((a, index) => {

    const submitted =
      !!a.submitted_at || a.status === "submitted";

    const score = scoreFor(a);

    const stats = referenceStats(
      a.exam_id || a.exam_code || a.exam_title
    );

    const difference =
      score === null
        ? null
        : score - stats.average;


    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${escapeHTML(a.member_number || "-")}</td>

      <td>${escapeHTML(a.full_name || "氏名不明")}</td>

      <td>${escapeHTML(a.exam_title || "-")}</td>

      <td>${escapeHTML(a.correct_count ?? "-")}</td>

      <td>
        ${score === null ? "-" : score + "点／100点"}
      </td>

      <td>${stats.average}点</td>

      <td>
        ${
          difference === null
            ? "-"
            : (difference >= 0 ? "+" : "") +
              difference + "点"
        }
      </td>

      <td>
        ${submitted ? "提出済み" : "受験中"}
      </td>

      <td class="no-print">
        <button onclick="toggleDetail(${index})">
          詳細
        </button>

        <button class="green"
          onclick="printIndividual(${index})">
          個人票印刷
        </button>
      </td>
    `;

    body.appendChild(row);


    const detailRow = document.createElement("tr");

    detailRow.id = "detail-" + index;
    detailRow.className = "hidden";

    const detailCell = document.createElement("td");

    detailCell.colSpan = 9;
    detailCell.innerHTML = detailHTML(a, score, stats);

    detailRow.appendChild(detailCell);

    body.appendChild(detailRow);

  });

}


/* =====================================
   12. 詳細表示
===================================== */

function toggleDetail(index) {

  document.getElementById(
    "detail-" + index
  ).classList.toggle("hidden");

}


/* =====================================
   13. 日時表示
===================================== */

function formatDate(value) {

  if (!value) {
    return "未提出";
  }

  const date = new Date(value);

  if (isNaN(date.getTime())) {
    return "-";
  }

  return date.toLocaleString("ja-JP", {
    timeZone: "Asia/Tokyo"
  });

}


/* =====================================
   14. 回答取得
===================================== */

function getAnswerMap(a) {

  return (
    a.answers && typeof a.answers === "object"
      ? a.answers
      : {}
  );

}


function selectedAnswer(a, q) {

  const answers = getAnswerMap(a);

  let value = answers[q.question_id || q.id];

  if (value === undefined) {
    value = answers[String(q.question_number)];
  }

  if (value === undefined) {
    value = answers[q.question_number - 1];
  }

  if (value && typeof value === "object") {
    value =
      value.answer ??
      value.selected ??
      value.value ??
      JSON.stringify(value);
  }

  return value;

}


/* =====================================
   15. 回答内容表示
===================================== */

function renderAnswerList(a) {

  const qs = questionsForAttempt(a).sort(
    (x, y) =>
      Number(x.question_number) -
      Number(y.question_number)
  );

  if (!qs.length) {

    return `
      <p class="small">
        問題情報を取得できませんでした。
      </p>
      <pre>${escapeHTML(
        JSON.stringify(a.answers || {}, null, 2)
      )}</pre>
    `;

  }


  return qs.map(q => {

    const selected = selectedAnswer(a, q);

    const correct = q.correct_answer;

    const answered =
      selected !== undefined &&
      selected !== null &&
      selected !== "";

    const isCorrect =
      answered &&
      String(selected) === String(correct);

    return `
      <div class="answer">

        <b>
          第${escapeHTML(q.question_number)}問
        </b>

        <p>
          ${escapeHTML(q.question_text || "")}
        </p>

        <p>
          受験者の回答：
          ${answered ? escapeHTML(selected) : "未回答"}
        </p>

        <p>
          正解：
          ${escapeHTML(correct ?? "未設定")}
        </p>

        <p class="${isCorrect ? "good" : "bad"}">
          ${
            !answered
              ? "未回答"
              : isCorrect
                ? "正解"
                : "不正解"
          }
        </p>

      </div>
    `;

  }).join("");

}


/* =====================================
   16. 詳細成績
===================================== */

function detailHTML(a, score, stats) {

  const difference =
    score === null
      ? null
      : score - stats.average;

  const total = questionCountFor(a);

  return `

    <div class="card">

      <p>
        <b>受験番号：</b>
        ${escapeHTML(a.member_number || "-")}
      </p>

      <p>
        <b>氏名：</b>
        ${escapeHTML(a.full_name || "氏名不明")}
      </p>

      <p>
        <b>試験：</b>
        ${escapeHTML(a.exam_title || "-")}
      </p>

      <p>
        <b>開始：</b>
        ${escapeHTML(formatDate(a.started_at))}
      </p>

      <p>
        <b>提出：</b>
        ${escapeHTML(formatDate(a.submitted_at))}
      </p>

      <p>
        <b>問題数：</b>
        ${total || "-"}問
      </p>

      <p>
        <b>正答数：</b>
        ${escapeHTML(a.correct_count ?? "-")}
      </p>

      <p>
        <b>得点：</b>
        ${score === null ? "採点不可" : score + "点／100点"}
      </p>

      <p>
        <b>参考平均点：</b>
        ${stats.average}点
      </p>

      <p>
        <b>平均点との差：</b>
        ${
          difference === null
            ? "-"
            : (difference >= 0 ? "+" : "") +
              difference + "点"
        }
      </p>

      <div class="comment">

        <b>講評</b>

        <p>
          ${
            score === null
              ? "得点を計算できません。問題数と正答数のデータを確認してください。"
              : commentFor(score)
          }
        </p>

      </div>

      <h3>回答内容・正誤</h3>

      ${renderAnswerList(a)}

    </div>

  `;

}


/* =====================================
   17. 成績一覧印刷
===================================== */

function printList() {

  const rows = filteredAttempts.filter(a =>
    a.submitted_at || a.status === "submitted"
  );

  if (!rows.length) {
    alert("印刷できる提出済み成績がありません。");
    return;
  }

  const html = `

    <div class="print-company">
      株式会社ゲートスクエア
    </div>

    <div class="print-title">
      オルビステスト 成績一覧
    </div>

    <table class="list-table">

      <thead>
        <tr>
          <th>受験番号</th>
          <th>氏名</th>
          <th>試験</th>
          <th>正答数</th>
          <th>得点</th>
          <th>参考平均</th>
          <th>平均差</th>
          <th>提出日時</th>
        </tr>
      </thead>

      <tbody>

        ${rows.map(a => {

          const score = scoreFor(a);

          const stats = referenceStats(
            a.exam_id || a.exam_code || a.exam_title
          );

          const difference =
            score === null
              ? "-"
              : (score - stats.average >= 0 ? "+" : "") +
                (score - stats.average) + "点";

          return `

            <tr>
              <td>${escapeHTML(a.member_number || "-")}</td>
              <td>${escapeHTML(a.full_name || "-")}</td>
              <td>${escapeHTML(a.exam_title || "-")}</td>
              <td>${escapeHTML(a.correct_count ?? "-")}</td>
              <td>${score === null ? "-" : score + "点／100点"}</td>
              <td>${stats.average}点</td>
              <td>${difference}</td>
              <td>${escapeHTML(formatDate(a.submitted_at))}</td>
            </tr>

          `;

        }).join("")}

      </tbody>

    </table>

    <div class="print-footer">
      株式会社ゲートスクエア
    </div>

  `;

  openPrintWindow("オルビステスト 成績一覧", html);

}


/* =====================================
   18. 個人票印刷
   受験者用PDFと同じレイアウト
===================================== */

function printIndividual(index) {

  const a = filteredAttempts[index];

  if (!a) {
    return;
  }

  const score = scoreFor(a);

  const stats = referenceStats(
    a.exam_id || a.exam_code || a.exam_title
  );

  const total = questionCountFor(a);

  const correct = Number(a.correct_count || 0);

  const difference =
    score === null
      ? null
      : score - stats.average;

  const examDate =
    a.submitted_at || a.started_at;

  const html = `

    <div class="print-company">
      株式会社ゲートスクエア
    </div>

    <div class="print-title">
      オルビステスト 成績表
    </div>

    <table class="result-table">

      <tbody>

        <tr>
          <th>受験者氏名</th>
          <td>${escapeHTML(a.full_name || "氏名不明")}</td>
        </tr>

        <tr>
          <th>受験番号</th>
          <td>${escapeHTML(a.member_number || "-")}</td>
        </tr>

        <tr>
          <th>試験名</th>
          <td>${escapeHTML(a.exam_title || "-")}</td>
        </tr>

        <tr>
          <th>受験日時</th>
          <td>${escapeHTML(formatDate(examDate))}</td>
        </tr>

        <tr>
          <th>問題数</th>
          <td>${total || "-"}問</td>
        </tr>

        <tr>
          <th>正答数</th>
          <td>${correct}問</td>
        </tr>

        <tr>
          <th>得点（100点満点）</th>
          <td>
            ${score === null ? "採点不可" : score + "点／100点"}
          </td>
        </tr>

        <tr>
          <th>参考平均点</th>
          <td>${stats.average}点（参考）</td>
        </tr>

        <tr>
          <th>平均点との差</th>
          <td>
            ${
              difference === null
                ? "-"
                : (difference >= 0 ? "+" : "") +
                  difference + "点"
            }
          </td>
        </tr>

      </tbody>

    </table>


    <div class="print-score">

      ${
        score === null
          ? "採点結果を確認できません。"
          : `${score}点／100点（正答数 ${correct} / ${total}問）`
      }

    </div>


    <div class="print-comment">

      <b>講評：</b>

      ${
        score === null
          ? "得点を計算できません。問題数と正答数のデータを確認してください。"
          : commentFor(score)
      }

    </div>


    <div class="print-footer">
      株式会社ゲートスクエア
    </div>

  `;

  openPrintWindow("オルビステスト 成績表", html);

}


/* =====================================
   19. 印刷画面
===================================== */

function openPrintWindow(title, body) {

  const win = window.open("", "_blank");

  if (!win) {

    alert(
      "印刷画面が開けません。\n" +
      "ブラウザのポップアップを許可してください。"
    );

    return;
  }

  win.document.write(
    printDocument(title, body)
  );

  win.document.close();
  win.focus();

  setTimeout(() => {
    win.print();
  }, 300);

}

async function logout() {

  await db.auth.signOut();

  location.reload();

}


/* =====================================
   22. 初期化
===================================== */

async function initialize() {

  const {
    data: { session }
  } = await db.auth.getSession();

  if (session) {
    await checkAdmin();
  }

}


db.auth.onAuthStateChange(event => {

  if (event === "SIGNED_OUT") {

    document.getElementById("dashboard")
      .classList.add("hidden");

    document.getElementById("loginCard")
      .classList.remove("hidden");

  }

});


document.getElementById("password")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {
      login();
    }

  });


initialize();

</script>
