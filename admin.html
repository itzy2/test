<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBIS TEST 管理者ページ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f1f5f9;
  color: #172033;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

header {
  background: #172554;
  color: white;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

main {
  max-width: 1250px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px #00000010;
}

h2 {
  font-size: 19px;
  margin-top: 0;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  margin: 7px 0 14px;
  font-size: 16px;
}

button {
  background: #1d4ed8;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 11px 16px;
  font-size: 14px;
  cursor: pointer;
  margin: 3px;
}

button.secondary {
  background: #475569;
}

button.green {
  background: #0f766e;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.hidden {
  display: none !important;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}

.stat {
  background: #eff6ff;
  border-radius: 10px;
  padding: 16px;
}

.stat strong {
  display: block;
  font-size: 25px;
  margin-top: 8px;
}

.table-wrap {
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
  background: white;
}

th, td {
  padding: 11px;
  border-bottom: 1px solid #e2e8f0;
  text-align: left;
  font-size: 14px;
  vertical-align: top;
}

th {
  background: #f8fafc;
  white-space: nowrap;
}

details {
  margin: 10px 0;
  background: #f8fafc;
  padding: 12px;
  border-radius: 8px;
}

.answer {
  padding: 12px;
  border-bottom: 1px solid #e2e8f0;
  line-height: 1.7;
  page-break-inside: avoid;
}

.good {
  color: #15803d;
  font-weight: bold;
}

.bad {
  color: #dc2626;
  font-weight: bold;
}

.small {
  font-size: 13px;
  color: #64748b;
}

.muted {
  color: #64748b;
}

.toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.comment {
  line-height: 1.9;
  background: #f8fafc;
  padding: 14px;
  border-radius: 8px;
  margin-top: 12px;
}

.stats-note {
  font-size: 12px;
  color: #64748b;
  margin-top: 8px;
}

.error {
  white-space: pre-wrap;
  color: #b91c1c;
}

@media print {
  @page {
    size: A4 landscape;
    margin: 12mm;
  }

  body {
    background: white;
  }

  header,
  #loginCard,
  .no-print {
    display: none !important;
  }

  main {
    max-width: none;
    margin: 0;
    padding: 0;
  }

  .card {
    box-shadow: none;
    border: 0;
    padding: 0;
  }

  table {
    font-size: 10px;
  }

  th, td {
    font-size: 10px;
    padding: 6px;
  }
}
</style>
</head>

<body>

<header>
  <h1>ORBIS TEST 管理者ページ</h1>
  <div class="small" style="color:#dbeafe">
    受験結果・成績・回答管理
  </div>
</header>

<main>

  <!-- ログイン -->
  <section id="loginCard" class="card">
    <h2>管理者ログイン</h2>

    <label>メールアドレス</label>
    <input
      id="email"
      type="email"
      autocomplete="username"
      placeholder="登録済みメールアドレス"
    >

    <label>パスワード</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="パスワード"
    >

    <button id="loginBtn" onclick="login()">
      ログイン
    </button>

    <div id="message" class="error"></div>
  </section>

  <!-- 管理画面 -->
  <section id="dashboard" class="hidden">

    <div class="card no-print">
      <div class="toolbar" style="justify-content:space-between">
        <h2>受験結果一覧</h2>

        <div>
          <button class="secondary" onclick="loadResults()">
            最新情報に更新
          </button>

          <button class="secondary" onclick="logout()">
            ログアウト
          </button>
        </div>
      </div>

      <div class="toolbar">
        <button class="green" onclick="printList()">
          成績一覧を印刷
        </button>
      </div>
    </div>

    <!-- 統計 -->
    <div class="card stats">
      <div class="stat">
        受験記録
        <strong id="totalCount">0</strong>
      </div>

      <div class="stat">
        提出済み
        <strong id="submittedCount">0</strong>
      </div>

      <div class="stat">
        受験中
        <strong id="ongoingCount">0</strong>
      </div>
    </div>

    <!-- 検索 -->
    <div class="card no-print">
      <h2>絞り込み</h2>

      <label>試験</label>
      <select id="examFilter" onchange="renderResults()">
        <option value="">すべての試験</option>
      </select>

      <label>受験者検索（受験番号・氏名）</label>
      <input
        id="memberFilter"
        placeholder="検索する文字を入力"
        oninput="renderResults()"
      >
    </div>

    <!-- 成績一覧 -->
    <div class="card">
      <h2>受験者の成績</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>受験番号</th>
              <th>氏名</th>
              <th>試験</th>
              <th>正答数</th>
              <th>得点（100点満点）</th>
              <th>参考平均点</th>
              <th>平均差</th>
              <th>状態</th>
              <th class="no-print">操作</th>
            </tr>
          </thead>

          <tbody id="resultsBody"></tbody>
        </table>
      </div>

      <div id="emptyMessage" class="small"></div>

      <p class="stats-note">
        ※参考平均点は試験ごとにランダム生成した固定の参考値です。
        実際の受験者全員の集計値ではありません。
      </p>
    </div>

  </section>

</main>

<script>
"use strict";

/* =========================
   Supabase設定
========================= */

const SUPABASE_URL =
  "https://hxrtpftlklgwesvanlpk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_b1tG9o1bXMzZBXGHBJZhZA_Ak-KYmnZ";

const ADMIN_ID =
  "4f0efa53-d67b-4d73-9b28-908eadc20525";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* =========================
   データ
========================= */

let attempts = [];
let questions = [];
let filteredAttempts = [];

/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function showMessage(t) {
  document.getElementById("message").textContent = t;
}

/* =========================
   参考平均点
========================= */

function seededNumber(seed, min, max, salt) {
  let h = 2166136261;
  const s = String(seed) + "|" + salt;

  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }

  return Math.floor(
    min + (h >>> 0) / 4294967295 * (max - min + 1)
  );
}

function referenceStats(examId) {
  return {
    average: seededNumber(examId, 60, 80, "average")
  };
}

/* =========================
   100点満点の得点計算
========================= */

function scoreFor(a) {
  const qs = questions.filter(q => q.exam_id === a.exam_id);

  const total =
    qs.length ||
    Number(a.total_questions) ||
    0;

  if (!total || a.correct_count == null) {
    return null;
  }

  return Math.round(
    Number(a.correct_count) / total * 100
  );
}

/* =========================
   総合講評
========================= */

function commentFor(score) {

  if (score >= 90) {
    return "非常に素晴らしい結果です。これまで積み重ねてきた努力が、今回の得点にしっかり表れています。間違えた問題や迷った問題も確認し、さらに高い目標に挑戦していきましょう。今後のさらなる成長を期待しています。";
  }

  if (score >= 80) {
    return "よく頑張りました。基礎から応用まで、学習の成果が表れています。正解できた問題は自信につなげ、惜しくも間違えた問題は解き方を振り返りましょう。あと一歩の確認を積み重ね、次回はさらに安定した結果を目指してください。";
  }

  if (score >= 60) {
    return "今回の試験、お疲れさまでした。理解できている内容がある一方、もう少し練習を重ねたい分野も見つかったと思います。間違えた問題を見直し、なぜその答えになるのか説明できるようにしましょう。毎日の積み重ねが次の成長につながります。";
  }

  if (score >= 40) {
    return "最後まで試験に取り組んだことを、次につながる経験として受け止めましょう。今回の結果から復習すべき内容が見えてきます。基本事項から一つずつ確認し、短い時間でも繰り返し練習してください。焦らず着実に取り組めば必ず前進できます。次回も諦めずに挑戦しましょう。";
  }

  return "今回の試験は、これからの学習方法を見直す良い機会です。思うような結果でなくても諦める必要はありません。基本事項を確認し、解けなかった問題を一問ずつ整理しましょう。分からないところをそのままにせず、少しずつ理解を積み重ねることが大切です。次回の挑戦を応援しています。";
}

/* =========================
   ログイン
========================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const btn =
    document.getElementById("loginBtn");

  if (!email || !password) {
    showMessage("メールアドレスとパスワードを入力してください。");
    return;
  }

  btn.disabled = true;
  showMessage("ログインしています...");

  try {

    const { error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    await checkAdmin();

  } catch (e) {

    showMessage(
      "ログインできませんでした。\n" + e.message
    );

  } finally {

    btn.disabled = false;

  }
}

/* =========================
   管理者確認
========================= */

async function checkAdmin() {

  const {
    data: { user },
    error
  } = await db.auth.getUser();

  if (error || !user) {
    showMessage("ログイン情報を確認できません。");
    return;
  }

  if (user.id !== ADMIN_ID) {

    await db.auth.signOut();

    showMessage(
      "このアカウントには管理者権限がありません。"
    );

    return;
  }

  document.getElementById("loginCard")
    .classList.add("hidden");

  document.getElementById("dashboard")
    .classList.remove("hidden");

  await loadResults();
}

/* =========================
   結果取得
========================= */

async function loadResults() {

  const { data, error } =
    await db.rpc("admin_get_results");

  if (error) {
    alert(
      "結果を取得できませんでした。\n" +
      error.message
    );
    return;
  }

  attempts = data?.attempts || [];
  questions = data?.questions || [];

  document.getElementById("totalCount").textContent =
    attempts.length;

  document.getElementById("submittedCount").textContent =
    attempts.filter(a =>
      a.submitted_at || a.status === "submitted"
    ).length;

  document.getElementById("ongoingCount").textContent =
    attempts.filter(a =>
      !a.submitted_at && a.status !== "submitted"
    ).length;

  const f = document.getElementById("examFilter");
  const old = f.value;

  const map = new Map();

  attempts.forEach(a => {
    map.set(a.exam_code, a.exam_title);
  });

  f.innerHTML =
    '<option value="">すべての試験</option>';

  map.forEach((title, code) => {

    const o = document.createElement("option");

    o.value = code || "";
    o.textContent = title || code || "試験名不明";

    f.appendChild(o);

  });

  f.value = old;

  renderResults();
}

/* =========================
   成績一覧表示
========================= */

function renderResults() {

  const exam =
    document.getElementById("examFilter").value;

  const keyword =
    document.getElementById("memberFilter")
      .value.trim().toLowerCase();

  filteredAttempts = attempts.filter(a =>
    (!exam || a.exam_code === exam) &&
    (
      `${a.member_number || ""} ${a.full_name || ""}`
    ).toLowerCase().includes(keyword)
  );

  const body =
    document.getElementById("resultsBody");

  body.replaceChildren();

  document.getElementById("emptyMessage").textContent =
    filteredAttempts.length
      ? ""
      : "該当する受験記録はありません。";

  filteredAttempts.forEach((a, i) => {

    const submitted =
      !!a.submitted_at || a.status === "submitted";

    const score = scoreFor(a);

    const stats = referenceStats(
      a.exam_id || a.exam_code || a.exam_title
    );

    const diff =
      score == null ? null : score - stats.average;

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${escapeHTML(a.member_number || "-")}</td>
      <td>${escapeHTML(a.full_name || "氏名不明")}</td>
      <td>${escapeHTML(a.exam_title || "-")}</td>
      <td>${escapeHTML(a.correct_count ?? "-")}</td>
      <td>${score == null ? "-" : score + "点／100点"}</td>
      <td>${stats.average}点</td>
      <td>
        ${diff == null
          ? "-"
          : (diff >= 0 ? "+" : "") + diff + "点"}
      </td>
      <td>${submitted ? "提出済み" : "受験中"}</td>

      <td class="no-print">
        <button onclick="toggleDetail(${i})">
          詳細
        </button>

        <button
          class="green"
          onclick="printIndividual(${i})"
          ${submitted ? "" : "disabled"}
        >
          成績表を印刷
        </button>
      </td>
    `;

    body.appendChild(tr);

    const dr = document.createElement("tr");

    dr.id = "detail-" + i;
    dr.className = "hidden";

    const td = document.createElement("td");

    td.colSpan = 9;
    td.innerHTML = detailHTML(a, score, stats);

    dr.appendChild(td);
    body.appendChild(dr);

  });
}

/* =========================
   詳細表示
========================= */

function toggleDetail(i) {

  document.getElementById("detail-" + i)
    .classList.toggle("hidden");

}

/* =========================
   日付表示
========================= */

function formatDate(v) {

  if (!v) return "未提出";

  const d = new Date(v);

  return isNaN(d.getTime())
    ? "-"
    : d.toLocaleString("ja-JP");

}

/* =========================
   回答データ
========================= */

function getAnswerMap(a) {

  return a.answers && typeof a.answers === "object"
    ? a.answers
    : {};

}

function selectedAnswer(a, q) {

  const ans = getAnswerMap(a);

  let v = ans[q.question_id || q.id];

  if (v === undefined) {
    v = ans[String(q.question_number)];
  }

  if (v === undefined) {
    v = ans[q.question_number - 1];
  }

  if (v && typeof v === "object") {
    v =
      v.answer ??
      v.selected ??
      v.value ??
      JSON.stringify(v);
  }

  return v;
}

/* =========================
   回答内容・正誤表示
========================= */

function renderAnswerList(a) {

  const qs = questions
    .filter(q => q.exam_id === a.exam_id)
    .sort((x, y) =>
      x.question_number - y.question_number
    );

  if (!qs.length) {
    return `
      <p>問題情報を取得できませんでした。</p>
      <pre>${escapeHTML(
        JSON.stringify(a.answers || {}, null, 2)
      )}</pre>
    `;
  }

  return qs.map(q => {

    const sel = selectedAnswer(a, q);
    const correct = q.correct_answer;

    const answered =
      sel !== undefined &&
      sel !== null &&
      sel !== "";

    const ok =
      answered &&
      String(sel) === String(correct);

    return `
      <div class="answer">

        <b>第${escapeHTML(q.question_number)}問</b>

        <p>
          ${escapeHTML(q.question_text || "")}
        </p>

        <p>
          受験者の回答：
          ${answered ? escapeHTML(sel) : "未回答"}
        </p>

        <p>
          正解：
          ${escapeHTML(correct ?? "未設定")}
        </p>

        <p class="${ok ? "good" : "bad"}">
          ${!answered
            ? "未回答"
            : ok
              ? "正解"
              : "不正解"}
        </p>

      </div>
    `;

  }).join("");
}

/* =========================
   管理者の詳細画面
========================= */

function detailHTML(a, score, stats) {

  const diff =
    score == null ? null : score - stats.average;

  return `
    <div class="card">

      <p>
        <b>受験番号：</b>
        ${escapeHTML(a.member_number || "-")}
      </p>

      <p>
        <b>氏名：</b>
        ${escapeHTML(a.full_name || "氏名不明")}
      </p>

      <p>
        <b>試験：</b>
        ${escapeHTML(a.exam_title || "-")}
      </p>

      <p>
        <b>開始：</b>
        ${escapeHTML(formatDate(a.started_at))}
      </p>

      <p>
        <b>提出：</b>
        ${escapeHTML(formatDate(a.submitted_at))}
      </p>

      <p>
        <b>正答数：</b>
        ${escapeHTML(a.correct_count ?? "-")}
      </p>

      <p>
        <b>得点：</b>
        ${score == null ? "-" : score + "点／100点"}
      </p>

      <p>
        <b>参考平均点：</b>
        ${stats.average}点
      </p>

      <p>
        <b>平均点との差：</b>
        ${diff == null
          ? "-"
          : (diff >= 0 ? "+" : "") + diff + "点"}
      </p>

      <div class="comment">
        <b>講評</b>
        <p>
          ${score == null
            ? "提出後に採点結果が表示されます。"
            : commentFor(score)}
        </p>
      </div>

      <h3>回答内容</h3>

      ${renderAnswerList(a)}

    </div>
  `;
}

/* =========================
   成績一覧の印刷
========================= */

function printList() {

  const rows = filteredAttempts.filter(a =>
    a.submitted_at || a.status === "submitted"
  );

  if (!rows.length) {
    alert("印刷できる提出済み成績がありません。");
    return;
  }

  const w = window.open("", "_blank");

  if (!w) {
    alert(
      "印刷画面が開けません。ポップアップを許可してください。"
    );
    return;
  }

  const html = `
    <table>
      <thead>
        <tr>
          <th>受験番号</th>
          <th>氏名</th>
          <th>試験</th>
          <th>正答数</th>
          <th>得点（100点満点）</th>
          <th>参考平均</th>
          <th>平均差</th>
          <th>提出日時</th>
        </tr>
      </thead>

      <tbody>
        ${rows.map(a => {

          const sc = scoreFor(a);

          const st = referenceStats(
            a.exam_id || a.exam_code || a.exam_title
          );

          const d =
            sc == null
              ? "-"
              : (sc - st.average >= 0 ? "+" : "") +
                (sc - st.average) + "点";

          return `
            <tr>
              <td>${escapeHTML(a.member_number || "-")}</td>
              <td>${escapeHTML(a.full_name || "-")}</td>
              <td>${escapeHTML(a.exam_title || "-")}</td>
              <td>${escapeHTML(a.correct_count ?? "-")}</td>
              <td>${sc == null ? "-" : sc + "点／100点"}</td>
              <td>${st.average}点</td>
              <td>${d}</td>
              <td>${escapeHTML(formatDate(a.submitted_at))}</td>
            </tr>
          `;

        }).join("")}
      </tbody>
    </table>
  `;

  w.document.write(
    printDocument("オルビステスト 成績一覧", html)
  );

  w.document.close();
  w.focus();

  setTimeout(() => w.print(), 300);
}

/* =========================
   個人成績表の印刷
   受験者向けと同じ項目構成
========================= */

function printIndividual(index) {

  const a = filteredAttempts[index];

  if (!a) return;

  if (!a.submitted_at && a.status !== "submitted") {
    alert("この受験者はまだ試験を提出していません。");
    return;
  }

  const score = scoreFor(a);

  const stats = referenceStats(
    a.exam_id || a.exam_code || a.exam_title
  );

  const diff =
    score == null ? null : score - stats.average;

  const html = `
    <div class="report">

      <h2 class="report-title">
        ORBIS TEST 成績表
      </h2>

      <div class="company">
        株式会社ゲートスクエア
      </div>

      <table class="profile">
        <tbody>

          <tr>
            <th>受験番号</th>
            <td>${escapeHTML(a.member_number || "-")}</td>

            <th>氏名</th>
            <td>${escapeHTML(a.full_name || "-")}</td>
          </tr>

          <tr>
            <th>試験名</th>
            <td colspan="3">
              ${escapeHTML(a.exam_title || "-")}
            </td>
          </tr>

          <tr>
            <th>試験開始日時</th>
            <td>${escapeHTML(formatDate(a.started_at))}</td>

            <th>提出日時</th>
            <td>${escapeHTML(formatDate(a.submitted_at))}</td>
          </tr>

        </tbody>
      </table>

      <h3>成績</h3>

      <table class="score-table">
        <thead>
          <tr>
            <th>正答数</th>
            <th>得点</th>
            <th>参考平均点</th>
            <th>平均点との差</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>
              ${escapeHTML(a.correct_count ?? "-")}問
            </td>

            <td class="main-score">
              ${score == null
                ? "-"
                : score + "点／100点"}
            </td>

            <td>${stats.average}点</td>

            <td>
              ${diff == null
                ? "-"
                : (diff >= 0 ? "+" : "") + diff + "点"}
            </td>
          </tr>
        </tbody>
      </table>

      <h3>総合講評</h3>

      <div class="comment">
        ${score == null
          ? "採点結果はまだありません。"
          : commentFor(score)}
      </div>

      <h3>回答内容・正誤</h3>

      ${renderAnswerList(a)}

      <div class="footer">
        ORBIS CBT SYSTEM
      </div>

    </div>
  `;

  const w = window.open("", "_blank");

  if (!w) {
    alert(
      "印刷画面が開けません。ポップアップを許可してください。"
    );
    return;
  }

  w.document.write(
    printDocument("ORBIS TEST 成績表", html)
  );

  w.document.close();
  w.focus();

  setTimeout(() => w.print(), 300);
}

/* =========================
   印刷ページ共通デザイン
========================= */

function printDocument(title, body) {

  return `<!DOCTYPE html>
  <html lang="ja">

  <head>
    <meta charset="UTF-8">

    <title>${escapeHTML(title)}</title>

    <style>

      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, "Noto Sans JP", sans-serif;
        color: #172033;
        background: white;
        margin: 0;
        padding: 20px;
      }

      .report {
        max-width: 900px;
        margin: 0 auto;
      }

      h1, h2, h3 {
        color: #172554;
      }

      .report-title {
        text-align: center;
        font-size: 25px;
        margin: 10px 0 5px;
        letter-spacing: 2px;
      }

      .company {
        text-align: center;
        font-size: 13px;
        margin-bottom: 25px;
      }

      h3 {
        font-size: 17px;
        border-left: 5px solid #1d4ed8;
        padding-left: 10px;
        margin-top: 25px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin: 15px 0;
      }

      th, td {
        border: 1px solid #64748b;
        padding: 11px;
        font-size: 13px;
        text-align: left;
      }

      th {
        background: #eff6ff;
        font-weight: bold;
      }

      .profile th {
        width: 18%;
      }

      .main-score {
        font-size: 23px;
        font-weight: bold;
        text-align: center;
      }

      .score-table td {
        text-align: center;
      }

      .comment {
        border: 1px solid #94a3b8;
        background: #f8fafc;
        border-radius: 8px;
        padding: 18px;
        line-height: 2;
        font-size: 13px;
        margin: 16px 0;
      }

      .answer {
        border-bottom: 1px solid #cbd5e1;
        padding: 12px 5px;
        line-height: 1.7;
        font-size: 12px;
        page-break-inside: avoid;
      }

      .good {
        color: #15803d;
        font-weight: bold;
      }

      .bad {
        color: #dc2626;
        font-weight: bold;
      }

      .footer {
        text-align: right;
        margin-top: 30px;
        font-size: 11px;
        color: #64748b;
      }

      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      @page {
        size: A4 portrait;
        margin: 15mm;
      }

      @media print {

        body {
          padding: 0;
        }

        .report {
          max-width: none;
        }

        h3 {
          break-after: avoid;
        }

        .comment {
          break-inside: avoid;
        }

        .answer {
          break-inside: avoid;
        }

      }

    </style>

  </head>

  <body>
    ${body}
  </body>

  </html>`;
}

/* =========================
   ログアウト
========================= */

async function logout() {

  await db.auth.signOut();

  location.reload();

}

/* =========================
   初期化
========================= */

async function initialize() {

  const {
    data: { session }
  } = await db.auth.getSession();

  if (session) {
    await checkAdmin();
  }

}

db.auth.onAuthStateChange(event => {

  if (event === "SIGNED_OUT") {

    document.getElementById("dashboard")
      .classList.add("hidden");

    document.getElementById("loginCard")
      .classList.remove("hidden");

  }

});

document.getElementById("password")
  .addEventListener("keydown", e => {

    if (e.key === "Enter") {
      login();
    }

  });

initialize();

</script>

</body>
</html>
