
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBIS TEST 管理者ページ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f1f5f9;
  color: #172033;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

header {
  background: #172554;
  color: white;
  padding: 22px;
}

header h1 {
  margin: 0;
  font-size: 23px;
}

header p {
  margin: 7px 0 0;
  color: #dbeafe;
  font-size: 13px;
}

main {
  max-width: 1350px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px #00000010;
}

h2 {
  font-size: 19px;
  margin-top: 0;
}

h3 {
  font-size: 17px;
  margin-top: 24px;
}

label {
  display: block;
  font-weight: bold;
  font-size: 14px;
  margin: 10px 0 5px;
}

input,
select,
textarea {
  display: block;
  width: 100%;
  padding: 12px;
  border: 2px solid #cbd5e1;
  border-radius: 8px;
  background: white;
  color: #172033;
  font-size: 15px;
  margin: 5px 0 14px;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px #2563eb20;
}

textarea {
  min-height: 130px;
  resize: vertical;
  line-height: 1.7;
}

button {
  background: #1d4ed8;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 11px 16px;
  font-size: 14px;
  cursor: pointer;
  margin: 3px;
}

button:hover {
  opacity: 0.88;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

button.secondary {
  background: #475569;
}

button.green {
  background: #0f766e;
}

button.red {
  background: #b91c1c;
}

.hidden {
  display: none !important;
}

.toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}

.stat {
  background: #eff6ff;
  border-radius: 10px;
  padding: 16px;
}

.stat strong {
  display: block;
  font-size: 27px;
  margin-top: 8px;
}

.table-wrap {
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
  background: white;
}

th,
td {
  padding: 11px;
  border-bottom: 1px solid #e2e8f0;
  text-align: left;
  font-size: 14px;
  vertical-align: top;
}

th {
  background: #f8fafc;
  white-space: nowrap;
}

.small {
  font-size: 13px;
  color: #64748b;
}

.error {
  color: #b91c1c;
  white-space: pre-wrap;
  margin-top: 10px;
}

.success {
  color: #15803d;
  white-space: pre-wrap;
  margin-top: 10px;
}

.detail-box {
  background: #f8fafc;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  padding: 18px;
  margin: 12px 0;
}

.answer {
  padding: 13px;
  border-bottom: 1px solid #e2e8f0;
  line-height: 1.7;
}

.good {
  color: #15803d;
  font-weight: bold;
}

.bad {
  color: #dc2626;
  font-weight: bold;
}

.comment {
  background: #f8fafc;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  padding: 15px;
  line-height: 1.8;
  margin-top: 15px;
  white-space: pre-wrap;
}

.edit-card {
  background: #f8fafc;
  border: 2px solid #94a3b8;
  border-radius: 12px;
  padding: 20px;
  margin-top: 18px;
}

.edit-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 18px;
}

.edit-field {
  min-width: 0;
}

.edit-field.full {
  grid-column: 1 / -1;
}

.edit-field input,
.edit-field textarea {
  border: 2px solid #94a3b8;
  background: white;
}

.edit-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 15px;
}

.status-label {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 6px;
  background: #e2e8f0;
  font-size: 12px;
}

@media (max-width: 700px) {
  .edit-grid {
    grid-template-columns: 1fr;
  }

  .edit-field.full {
    grid-column: auto;
  }

  main {
    padding: 0 9px;
  }

  .card {
    padding: 14px;
  }
}

@media print {
  @page {
    size: A4 landscape;
    margin: 12mm;
  }

  body {
    background: white;
  }

  header,
  .no-print {
    display: none !important;
  }

  main {
    max-width: none;
    margin: 0;
    padding: 0;
  }

  .card {
    box-shadow: none;
    border: 0;
    padding: 0;
  }

  th,
  td {
    font-size: 10px;
    padding: 6px;
  }
}
</style>
</head>

<body>

<header>
  <h1>ORBIS TEST 管理者ページ</h1>
  <p>受験結果・成績編集・回答確認・印刷管理</p>
</header>

<main>

<!-- 管理者ログイン -->

<section id="loginCard" class="card">
  <h2>管理者ログイン</h2>

  <label for="email">メールアドレス</label>
  <input
    id="email"
    type="email"
    autocomplete="username"
    placeholder="登録済みメールアドレス"
  >

  <label for="password">パスワード</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="パスワード"
  >

  <button id="loginBtn" onclick="login()">ログイン</button>

  <div id="message" class="error"></div>
</section>


<!-- 管理者ダッシュボード -->

<section id="dashboard" class="hidden">

  <div class="card no-print">
    <div class="toolbar">
      <h2>管理者メニュー</h2>

      <div>
        <button class="secondary" onclick="loadResults()">
          最新情報に更新
        </button>

        <button class="secondary" onclick="logout()">
          ログアウト
        </button>
      </div>
    </div>

    <button class="green" onclick="printList()">
      成績一覧を印刷
    </button>
  </div>


  <!-- 集計 -->

  <div class="card stats">
    <div class="stat">
      受験記録
      <strong id="totalCount">0</strong>
    </div>

    <div class="stat">
      提出済み
      <strong id="submittedCount">0</strong>
    </div>

    <div class="stat">
      受験中
      <strong id="ongoingCount">0</strong>
    </div>
  </div>


  <!-- 検索 -->

  <div class="card no-print">
    <h2>受験者検索・絞り込み</h2>

    <label for="examFilter">試験名</label>
    <select id="examFilter" onchange="renderResults()">
      <option value="">すべての試験</option>
    </select>

    <label for="memberFilter">受験番号・氏名</label>
    <input
      id="memberFilter"
      type="text"
      placeholder="受験番号または氏名を入力"
      oninput="renderResults()"
    >
  </div>


  <!-- 成績一覧 -->

  <div class="card">
    <h2>受験者の成績一覧</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>受験番号</th>
            <th>氏名</th>
            <th>試験名</th>
            <th>正解数</th>
            <th>問題数</th>
            <th>得点</th>
            <th>平均点</th>
            <th>平均差</th>
            <th>状態</th>
            <th class="no-print">操作</th>
          </tr>
        </thead>

        <tbody id="resultsBody"></tbody>
      </table>
    </div>

    <p id="emptyMessage" class="small"></p>

    <p class="small">
      ※平均点は管理者が編集できます。未編集の場合は参考値を表示します。
      実際の全受験者の平均点ではありません。
    </p>
  </div>

</section>

</main>


<script>
"use strict";


/* =====================================
   Supabase設定
===================================== */

const SUPABASE_URL =
  "https://hxrtpftlklgwesvanlpk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_b1tG9o1bXMzZBXGHBJZhZA_Ak-KYmnZ";

const ADMIN_ID =
  "4f0efa53-d67b-4d73-9b28-908eadc20525";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   データ保存用
===================================== */

let attempts = [];
let questions = [];
let filteredAttempts = [];


/* =====================================
   共通処理
===================================== */

function escapeHTML(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]
  );
}


function showMessage(message) {
  document.getElementById("message").textContent = message;
}


function formatDate(value) {
  if (!value) return "-";

  const date = new Date(value);

  if (isNaN(date.getTime())) return "-";

  return date.toLocaleString("ja-JP");
}


function toLocalDateTime(value) {
  if (!value) return "";

  const date = new Date(value);

  if (isNaN(date.getTime())) return "";

  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  const hour = String(date.getHours()).padStart(2, "0");
  const minute = String(date.getMinutes()).padStart(2, "0");

  return `${year}-${month}-${day}T${hour}:${minute}`;
}


/* =====================================
   参考平均点
===================================== */

function seededNumber(seed, min, max, salt) {
  let hash = 2166136261;

  const text = String(seed) + "|" + salt;

  for (let i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }

  return Math.floor(
    min + (hash >>> 0) / 4294967295 * (max - min + 1)
  );
}


function referenceStats(attempt) {
  if (attempt.admin_reference_average !== null &&
      attempt.admin_reference_average !== undefined) {
    return {
      average: Number(attempt.admin_reference_average)
    };
  }

  const seed =
    attempt.exam_id ||
    attempt.exam_code ||
    attempt.exam_title ||
    "default";

  return {
    average: seededNumber(seed, 60, 80, "average")
  };
}


/* =====================================
   問題数・得点
===================================== */

function questionCountFor(attempt) {
  if (
    attempt.admin_question_count_override !== null &&
    attempt.admin_question_count_override !== undefined
  ) {
    return Number(attempt.admin_question_count_override);
  }

  const actualCount = questions.filter(
    q => q.exam_id === attempt.exam_id
  ).length;

  if (actualCount > 0) return actualCount;

  return Number(attempt.total_questions || 0);
}


function scoreFor(attempt) {
  if (
    attempt.admin_score_override !== null &&
    attempt.admin_score_override !== undefined
  ) {
    return Number(attempt.admin_score_override);
  }

  const total = questionCountFor(attempt);

  if (!total || attempt.correct_count === null ||
      attempt.correct_count === undefined) {
    return null;
  }

  return Math.round(
    Number(attempt.correct_count) / total * 100
  );
}


function commentFor(attempt) {
  if (attempt.admin_comment) {
    return attempt.admin_comment;
  }

  const score = scoreFor(attempt);

  if (score === null) {
    return "採点結果はまだありません。";
  }

  if (score >= 90) {
    return "非常に素晴らしい結果です。これまで積み重ねてきた努力が、今回の得点に表れています。間違えた問題や迷った問題も確認し、さらに高い目標に挑戦していきましょう。";
  }

  if (score >= 80) {
    return "よく頑張りました。学習の成果が表れています。正解できた問題は自信につなげ、間違えた問題は解き方を振り返りましょう。";
  }

  if (score >= 60) {
    return "今回の試験、お疲れさまでした。間違えた問題を見直し、なぜその答えになるのか説明できるようにしましょう。毎日の積み重ねが次の成長につながります。";
  }

  if (score >= 40) {
    return "最後まで試験に取り組んだことを、次につながる経験として受け止めましょう。基本事項から一つずつ確認し、繰り返し練習してください。";
  }

  return "今回の試験は、これからの学習方法を見直す良い機会です。解けなかった問題を一問ずつ整理し、少しずつ理解を積み重ねていきましょう。";
}


/* =====================================
   ログイン
===================================== */

async function login() {
  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const button =
    document.getElementById("loginBtn");

  if (!email || !password) {
    showMessage("メールアドレスとパスワードを入力してください。");
    return;
  }

  button.disabled = true;

  showMessage("ログインしています...");

  try {
    const { error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    await checkAdmin();

  } catch (error) {
    showMessage(
      "ログインできませんでした。\n" + error.message
    );

  } finally {
    button.disabled = false;
  }
}


/* =====================================
   管理者確認
===================================== */

async function checkAdmin() {
  const {
    data: { user },
    error
  } = await db.auth.getUser();

  if (error || !user) {
    showMessage("ログイン情報を確認できません。");
    return;
  }

  if (user.id !== ADMIN_ID) {
    await db.auth.signOut();

    showMessage(
      "このアカウントには管理者権限がありません。"
    );

    return;
  }

  document.getElementById("loginCard")
    .classList.add("hidden");

  document.getElementById("dashboard")
    .classList.remove("hidden");

  await loadResults();
}


/* =====================================
   結果読み込み
===================================== */

async function loadResults() {
  const { data, error } =
    await db.rpc("admin_get_results");

  if (error) {
    alert(
      "結果を取得できませんでした。\n" +
      error.message
    );

    return;
  }

  attempts = data?.attempts || [];
  questions = data?.questions || [];

  document.getElementById("totalCount").textContent =
    attempts.length;

  document.getElementById("submittedCount").textContent =
    attempts.filter(
      a => a.submitted_at || a.status === "submitted"
    ).length;

  document.getElementById("ongoingCount").textContent =
    attempts.filter(
      a => !a.submitted_at && a.status !== "submitted"
    ).length;

  const filter =
    document.getElementById("examFilter");

  const previousValue = filter.value;

  const examMap = new Map();

  attempts.forEach(attempt => {
    examMap.set(
      attempt.exam_code || "",
      attempt.admin_exam_title_override ||
      attempt.exam_title ||
      "試験名不明"
    );
  });

  filter.innerHTML =
    '<option value="">すべての試験</option>';

  examMap.forEach((title, code) => {
    const option = document.createElement("option");

    option.value = code;
    option.textContent = title;

    filter.appendChild(option);
  });

  filter.value = previousValue;

  renderResults();
}


/* =====================================
   一覧表示
===================================== */

function renderResults() {
  const exam =
    document.getElementById("examFilter").value;

  const keyword =
    document.getElementById("memberFilter")
      .value.trim().toLowerCase();

  filteredAttempts = attempts.filter(attempt => {
    const matchExam =
      !exam || attempt.exam_code === exam;

    const searchText =
      `${attempt.member_number || ""} ${attempt.full_name || ""}`
        .toLowerCase();

    return matchExam && searchText.includes(keyword);
  });

  const body =
    document.getElementById("resultsBody");

  body.replaceChildren();

  document.getElementById("emptyMessage").textContent =
    filteredAttempts.length
      ? ""
      : "該当する受験記録はありません。";

  filteredAttempts.forEach((attempt, index) => {
    const submitted =
      !!attempt.submitted_at ||
      attempt.status === "submitted";

    const total = questionCountFor(attempt);
    const score = scoreFor(attempt);
    const average = referenceStats(attempt).average;

    const difference =
      score === null ? null : score - average;

    const title =
      attempt.admin_exam_title_override ||
      attempt.exam_title ||
      "-";

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${escapeHTML(attempt.member_number || "-")}</td>

      <td>${escapeHTML(attempt.full_name || "氏名不明")}</td>

      <td>${escapeHTML(title)}</td>

      <td>${escapeHTML(attempt.correct_count ?? "-")}</td>

      <td>${escapeHTML(total)}</td>

      <td>
        ${score === null ? "-" : score + "点／100点"}
      </td>

      <td>${average}点</td>

      <td>
        ${
          difference === null
            ? "-"
            : (difference >= 0 ? "+" : "") +
              difference + "点"
        }
      </td>

      <td>
        <span class="status-label">
          ${submitted ? "提出済み" : "受験中"}
        </span>
      </td>

      <td class="no-print">
        <button onclick="toggleDetail(${index})">
          詳細
        </button>

        <button class="green"
          onclick="printIndividual(${index})">
          個人票印刷
        </button>
      </td>
    `;

    body.appendChild(row);

    const detailRow = document.createElement("tr");

    detailRow.id = "detail-" + index;
    detailRow.className = "hidden";

    const detailCell = document.createElement("td");

    detailCell.colSpan = 10;

    detailCell.innerHTML =
      detailHTML(attempt, index);

    detailRow.appendChild(detailCell);

    body.appendChild(detailRow);
  });
}


/* =====================================
   詳細表示
===================================== */

function toggleDetail(index) {
  const element =
    document.getElementById("detail-" + index);

  if (element) {
    element.classList.toggle("hidden");
  }
}


function detailHTML(attempt, index) {
  const score = scoreFor(attempt);
  const total = questionCountFor(attempt);
  const average = referenceStats(attempt).average;

  const title =
    attempt.admin_exam_title_override ||
    attempt.exam_title ||
    "-";

  const examDate =
    attempt.admin_exam_datetime_override ||
    attempt.started_at;

  return `
    <div class="detail-box">

      <h3>受験者情報</h3>

      <p>
        <b>受験番号：</b>
        ${escapeHTML(attempt.member_number || "-")}
      </p>

      <p>
        <b>氏名：</b>
        ${escapeHTML(attempt.full_name || "-")}
      </p>

      <p>
        <b>試験名：</b>
        ${escapeHTML(title)}
      </p>

      <p>
        <b>受験日時：</b>
        ${escapeHTML(formatDate(examDate))}
      </p>

      <p>
        <b>正解数：</b>
        ${escapeHTML(attempt.correct_count ?? "-")}
      </p>

      <p>
        <b>問題数：</b>
        ${escapeHTML(total)}
      </p>

      <p>
        <b>得点：</b>
        ${score === null ? "-" : score + "点／100点"}
      </p>

      <p>
        <b>参考平均点：</b>
        ${average}点
      </p>

      <div class="comment">
        <b>管理者コメント・講評</b>

        <p>${escapeHTML(commentFor(attempt))}</p>
      </div>

      <div class="no-print">
        <button onclick="openEditForm(${index})">
          成績を編集する
        </button>
      </div>

      <div id="edit-area-${index}" class="hidden"></div>

      <h3>受験者の回答内容</h3>

      ${renderAnswerList(attempt)}

    </div>
  `;
}


/* =====================================
   編集フォーム
===================================== */

function openEditForm(index) {
  const attempt = filteredAttempts[index];

  if (!attempt) return;

  const area =
    document.getElementById("edit-area-" + index);

  if (!area) return;

  const total = questionCountFor(attempt);
  const score = scoreFor(attempt);
  const average = referenceStats(attempt).average;

  const examTitle =
    attempt.admin_exam_title_override ||
    attempt.exam_title ||
    "";

  const examDate =
    attempt.admin_exam_datetime_override ||
    attempt.started_at ||
    "";

  const comment = commentFor(attempt);

  area.classList.remove("hidden");

  area.innerHTML = `
    <div class="edit-card">

      <h3>成績編集画面</h3>

      <p class="small">
        入力内容を変更して「変更を保存」を押してください。
        保存後、一覧と印刷用成績表にも反映されます。
      </p>

      <div class="edit-grid">

        <div class="edit-field">
          <label>受験番号</label>
          <input
            id="edit-number-${index}"
            type="text"
            value="${escapeHTML(attempt.member_number || "")}"
          >
        </div>

        <div class="edit-field">
          <label>氏名</label>
          <input
            id="edit-name-${index}"
            type="text"
            value="${escapeHTML(attempt.full_name || "")}"
          >
        </div>

        <div class="edit-field full">
          <label>試験名</label>
          <input
            id="edit-title-${index}"
            type="text"
            value="${escapeHTML(examTitle)}"
          >
        </div>

        <div class="edit-field full">
          <label>受験日時</label>
          <input
            id="edit-date-${index}"
            type="datetime-local"
            value="${escapeHTML(toLocalDateTime(examDate))}"
          >
        </div>

        <div class="edit-field">
          <label>問題数</label>
          <input
            id="edit-total-${index}"
            type="number"
            min="0"
            step="1"
            value="${escapeHTML(total)}"
          >
        </div>

        <div class="edit-field">
          <label>正解数</label>
          <input
            id="edit-correct-${index}"
            type="number"
            min="0"
            step="1"
            value="${escapeHTML(attempt.correct_count ?? 0)}"
          >
        </div>

        <div class="edit-field">
          <label>得点（100点満点）</label>
          <input
            id="edit-score-${index}"
            type="number"
            min="0"
            max="100"
            step="1"
            value="${score === null ? 0 : escapeHTML(score)}"
          >
        </div>

        <div class="edit-field">
          <label>参考平均点（100点満点）</label>
          <input
            id="edit-average-${index}"
            type="number"
            min="0"
            max="100"
            step="1"
            value="${escapeHTML(average)}"
          >
        </div>

        <div class="edit-field full">
          <label>管理者コメント・講評</label>
          <textarea
            id="edit-comment-${index}"
          >${escapeHTML(comment)}</textarea>
        </div>

      </div>

      <div id="edit-message-${index}" class="error"></div>

      <div class="edit-actions">
        <button
          class="green"
          id="save-button-${index}"
          onclick="saveEdit(${index})"
        >
          変更を保存
        </button>

        <button
          class="secondary"
          onclick="closeEditForm(${index})"
        >
          キャンセル
        </button>
      </div>

    </div>
  `;
}


function closeEditForm(index) {
  const area =
    document.getElementById("edit-area-" + index);

  if (area) {
    area.classList.add("hidden");
    area.innerHTML = "";
  }
}


/* =====================================
   編集内容の保存
===================================== */

async function saveEdit(index) {
  const attempt = filteredAttempts[index];

  if (!attempt) return;

  const getValue = id =>
    document.getElementById(id).value.trim();

  const memberNumber =
    getValue("edit-number-" + index);

  const fullName =
    getValue("edit-name-" + index);

  const examTitle =
    getValue("edit-title-" + index);

  const dateValue =
    getValue("edit-date-" + index);

  const questionCount =
    Number(getValue("edit-total-" + index));

  const correctCount =
    Number(getValue("edit-correct-" + index));

  const score =
    Number(getValue("edit-score-" + index));

  const average =
    Number(getValue("edit-average-" + index));

  const comment =
    getValue("edit-comment-" + index);

  const message =
    document.getElementById("edit-message-" + index);

  const button =
    document.getElementById("save-button-" + index);

  message.textContent = "";

  if (!memberNumber || !fullName || !examTitle) {
    message.textContent =
      "受験番号・氏名・試験名を入力してください。";
    return;
  }

  if (
    !Number.isInteger(questionCount) ||
    questionCount < 0
  ) {
    message.textContent =
      "問題数は0以上の整数で入力してください。";
    return;
  }

  if (
    !Number.isInteger(correctCount) ||
    correctCount < 0 ||
    correctCount > questionCount
  ) {
    message.textContent =
      "正解数は0以上で、問題数以下にしてください。";
    return;
  }

  if (
    !Number.isInteger(score) ||
    score < 0 ||
    score > 100
  ) {
    message.textContent =
      "得点は0点から100点の整数で入力してください。";
    return;
  }

  if (
    !Number.isInteger(average) ||
    average < 0 ||
    average > 100
  ) {
    message.textContent =
      "平均点は0点から100点の整数で入力してください。";
    return;
  }

  let examDateISO = null;

  if (dateValue) {
    const date = new Date(dateValue);

    if (isNaN(date.getTime())) {
      message.textContent =
        "受験日時を正しく入力してください。";
      return;
    }

    examDateISO = date.toISOString();
  }

  button.disabled = true;
  button.textContent = "保存しています...";

  try {
    const { data, error } = await db.rpc(
      "admin_update_attempt",
      {
        p_attempt_id: attempt.attempt_id,
        p_full_name: fullName,
        p_member_number: memberNumber,
        p_exam_title: examTitle,
        p_exam_datetime: examDateISO,
        p_question_count: questionCount,
        p_correct_count: correctCount,
        p_score: score,
        p_reference_average: average,
        p_comment: comment
      }
    );

    if (error) throw error;

    if (data && data.success === false) {
      throw new Error(
        data.message || "保存できませんでした。"
      );
    }

    alert("成績を保存しました。");

    await loadResults();

  } catch (error) {
    message.textContent =
      "保存に失敗しました。\n" + error.message;

    button.disabled = false;
    button.textContent = "変更を保存";
  }
}


/* =====================================
   回答内容
===================================== */

function getAnswerMap(attempt) {
  if (
    attempt.answers &&
    typeof attempt.answers === "object"
  ) {
    return attempt.answers;
  }

  return {};
}


function selectedAnswer(attempt, question) {
  const answers = getAnswerMap(attempt);

  let value =
    answers[question.question_id || question.id];

  if (value === undefined) {
    value = answers[String(question.question_number)];
  }

  if (value === undefined) {
    value = answers[question.question_number - 1];
  }

  if (value && typeof value === "object") {
    value =
      value.answer ??
      value.selected ??
      value.value ??
      JSON.stringify(value);
  }

  return value;
}


function renderAnswerList(attempt) {
  const examQuestions = questions
    .filter(q => q.exam_id === attempt.exam_id)
    .sort(
      (a, b) =>
        Number(a.question_number) -
        Number(b.question_number)
    );

  if (!examQuestions.length) {
    return `
      <p class="small">
        問題情報が取得できませんでした。
      </p>

      <pre>${escapeHTML(
        JSON.stringify(attempt.answers || {}, null, 2)
      )}</pre>
    `;
  }

  return examQuestions.map(question => {
    const selected =
      selectedAnswer(attempt, question);

    const correct =
      question.correct_answer;

    const answered =
      selected !== undefined &&
      selected !== null &&
      selected !== "";

    const isCorrect =
      answered &&
      String(selected) === String(correct);

    return `
      <div class="answer">

        <b>
          第${escapeHTML(question.question_number)}問
        </b>

        <p>
          ${escapeHTML(question.question_text || "")}
        </p>

        <p>
          <b>受験者の回答：</b>
          ${answered ? escapeHTML(selected) : "未回答"}
        </p>

        <p>
          <b>正解：</b>
          ${escapeHTML(correct ?? "未設定")}
        </p>

        <p class="${isCorrect ? "good" : "bad"}">
          ${
            !answered
              ? "未回答"
              : isCorrect
                ? "正解"
                : "不正解"
          }
        </p>

      </div>
    `;
  }).join("");
}
