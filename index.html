
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オルビス CBT 試験システム</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

header {
  background: #17365d;
  color: white;
  padding: 22px;
  text-align: center;
}

main {
  max-width: 850px;
  margin: 30px auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #0001;
  margin-bottom: 20px;
}

h1, h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  border: none;
  border-radius: 7px;
  background: #1d4ed8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1e40af;
}

.exam-button {
  background: #0f766e;
}

.hidden {
  display: none !important;
}

.error {
  color: #dc2626;
  font-weight: bold;
}

.notice {
  background: #eff6ff;
  padding: 12px;
  border-radius: 7px;
}

.question {
  padding: 18px 0;
  border-bottom: 1px solid #ddd;
}

.question label {
  font-weight: normal;
}

.question input {
  margin-bottom: 8px;
}

#timer {
  position: sticky;
  top: 0;
  background: #991b1b;
  color: white;
  text-align: center;
  padding: 12px;
  font-size: 22px;
  font-weight: bold;
  z-index: 5;
}

footer {
  text-align: center;
  color: #64748b;
  padding: 25px;
}
</style>
</head>

<body>

<header>
  <h1>オルビス CBT 試験システム</h1>
  <p>オンライン試験・受験管理システム</p>
</header>

<main>

<!-- ログイン画面 -->
<section id="login" class="card">
  <h2>受験者ログイン</h2>

  <p>会員情報を入力してください。</p>

  <label>会員番号</label>
  <input id="memberNumber" placeholder="会員番号">

  <label>氏名</label>
  <input id="memberName" placeholder="氏名">

  <label>パスワード</label>
  <input id="password" type="password" placeholder="パスワード">

  <button onclick="login()">ログイン</button>

  <p id="loginMessage" class="error"></p>
</section>

<!-- テスト選択画面 -->
<section id="selection" class="card hidden">
  <h2>試験選択</h2>

  <p id="welcome"></p>

  <div class="notice">
    受験できる試験を選択してください。
  </div>

  <button class="exam-button" onclick="startExam('regular')">
    オルビステスト定期テストⅠ
    <br>50問・120分
  </button>

  <button class="exam-button" onclick="startExam('general')">
    オルビステスト総合問題２
    <br>80分・100点満点
  </button>

  <p id="selectionMessage" class="error"></p>
</section>

<!-- 試験画面 -->
<section id="exam" class="hidden">
  <div id="timer">残り時間 00:00</div>

  <div class="card">
    <h2 id="examTitle"></h2>
    <p id="examDescription"></p>
    <div id="questions"></div>
    <button onclick="submitExam()">試験を終了して提出する</button>
  </div>
</section>

<!-- 結果画面 -->
<section id="result" class="card hidden">
  <h2>試験終了</h2>
  <p>受験が完了しました。</p>
  <h3 id="resultMessage"></h3>
</section>

</main>

<footer>
  ORBIS CBT SYSTEM
</footer>

<script>
/* ==================================
   Supabase接続設定
   ================================== */

const SUPABASE_URL = "https://hxrtpftlklgwesvanlpk.supabase.co";
const SUPABASE_KEY = "sb_publishable_b1tG9o1bXMzZBXGHBJZhZA_Ak-KYmnZ";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* ==================================
   システム変数
   ================================== */

let currentMember = null;
let currentExam = null;
let currentAttempt = null;
let timeLeft = 0;
let timerInterval = null;
let submitting = false;

/* ==================================
   ログイン
   ================================== */

async function login() {
  const number = document.getElementById("memberNumber").value.trim();
  const name = document.getElementById("memberName").value.trim();
  const password = document.getElementById("password").value;

  const message = document.getElementById("loginMessage");

  message.textContent = "";

  if (!number || !name || !password) {
    message.textContent = "すべての項目を入力してください。";
    return;
  }

  try {
    const email = number + "@orbis.example";

    const { data, error } =
      await db.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) throw error;

    const { data: member, error: memberError } =
      await db
        .from("members")
        .select("member_number, name")
        .eq("member_number", number)
        .maybeSingle();

    if (memberError) throw memberError;

    if (!member || member.name !== name) {
      await db.auth.signOut();
      throw new Error("会員番号または氏名が一致しません。");
    }

    currentMember = member;

    document.getElementById("login").classList.add("hidden");
    document.getElementById("selection").classList.remove("hidden");

    document.getElementById("welcome").textContent =
      name + " さん、ログインしました。";

  } catch (error) {
    message.textContent = error.message;
  }
}

/* ==================================
   試験開始
   ================================== */

async function startExam(type) {
  const message = document.getElementById("selectionMessage");
  message.textContent = "";

  if (!currentMember) {
    message.textContent = "ログインしてください。";
    return;
  }

  try {
    const examCode =
      type === "regular"
        ? "regular"
        : "general";

    const { data: attemptId, error } =
      await db.rpc("start_exam", {
        p_exam_code: examCode
      });

    if (error) throw error;

    currentAttempt = attemptId;
    currentExam = type;

    const { data: exam, error: examError } =
      await db
        .from("exams")
        .select("*")
        .eq("exam_code", examCode)
        .single();

    if (examError) throw examError;

    const { data: questions, error: questionError } =
      await db
        .from("questions")
        .select("id, question_number, question_text, choices")
        .eq("exam_code", examCode)
        .order("question_number");

    if (questionError) throw questionError;

    if (!questions || questions.length === 0) {
      throw new Error("問題データが登録されていません。");
    }

    timeLeft = type === "regular"
      ? 120 * 60
      : 80 * 60;

    document.getElementById("selection").classList.add("hidden");
    document.getElementById("exam").classList.remove("hidden");

    document.getElementById("examTitle").textContent = exam.title;

    document.getElementById("examDescription").textContent =
      "制限時間内にすべての問題に回答してください。";

    renderQuestions(questions);
    startTimer();

  } catch (error) {
    message.textContent = error.message;
  }
}

/* ==================================
   問題表示
   ================================== */

function renderQuestions(questions) {
  const area = document.getElementById("questions");
  area.innerHTML = "";

  questions.forEach((q, index) => {
    const div = document.createElement("div");
    div.className = "question";

    const title = document.createElement("h3");
    title.textContent =
      "問題 " + (q.question_number || index + 1);

    const text = document.createElement("p");
    text.textContent = q.question_text;

    div.appendChild(title);
    div.appendChild(text);

    if (Array.isArray(q.choices) && q.choices.length > 0) {
      q.choices.forEach((choice, i) => {
        const label = document.createElement("label");
        const input = document.createElement("input");

        input.type = "radio";
        input.name = "answer_" + q.id;
        input.value = String(i);

        label.appendChild(input);
        label.appendChild(
          document.createTextNode(" " + choice)
        );

        div.appendChild(label);
      });
    } else {
      const input = document.createElement("input");
      input.type = "text";
      input.id = "answer_" + q.id;
      input.placeholder = "回答を入力してください";

      div.appendChild(input);
    }

    area.appendChild(div);
  });
}

/* ==================================
   タイマー
   ================================== */

function startTimer() {
  updateTimer();

  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimer();

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      submitExam();
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timeLeft / 60);
  const seconds = timeLeft % 60;

  document.getElementById("timer").textContent =
    "残り時間 " +
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0");
}

/* ==================================
   回答提出
   ================================== */

async function submitExam() {
  if (submitting || !currentAttempt) return;

  submitting = true;
  clearInterval(timerInterval);

  const answers = {};

  document.querySelectorAll("#questions .question").forEach(div => {
    const radio = div.querySelector("input[type=radio]:checked");

    if (radio) {
      const all = div.querySelector("input[type=radio]");
      answers[all.name.replace("answer_", "")] = radio.value;
      return;
    }

    const input = div.querySelector("input[type=text]");

    if (input) {
      answers[input.id.replace("answer_", "")] = input.value;
    }
  });

  try {
    const { data, error } = await db.rpc("submit_exam", {
      p_attempt_id: currentAttempt,
      p_answers: answers
    });

    if (error) throw error;

    document.getElementById("exam").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    document.getElementById("resultMessage").textContent =
      "正答数：" + data + "問";

  } catch (error) {
    submitting = false;
    document.getElementById("examDescription").textContent =
      "提出に失敗しました：" + error.message;
  }
}
</script>

</body>
</html>
